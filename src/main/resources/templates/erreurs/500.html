<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erreur 500')}"></head>
<body>
<header th:replace="~{fragments/entete :: entete}"></header>

<main class="container page-erreur">
	<p class="code-erreur">500</p>
	<h1>Erreur interne</h1>
	<p>Une erreur inattendue s'est produite. Réessayez dans quelques instants ; si le problème continue, prévenez l'administrateur.</p>
	<p class="chemin-erreur" th:if="${path}">Adresse : <code th:text="${path}">/besoins/12</code></p>
	<p>
		<a class="bouton" th:href="@{/}" href="#">Retour à l'accueil</a>
		<a class="bouton bouton-secondaire" th:if="${utilisateur != null and !utilisateur.estCandidat()}" th:href="@{/tableau-de-bord}" href="#">Tableau de bord</a>
	</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
