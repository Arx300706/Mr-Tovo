<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{public/layout-public :: head(${title})}">
	<meta charset="UTF-8">
	<title>Offres d'emploi | Mr Tovo</title>
	<link rel="stylesheet" href="../../static/css/style.css">
	<link rel="stylesheet" href="../../static/css/recrutement.css">
</head>
<body class="page-public">
<header th:replace="~{public/layout-public :: entete}"></header>

<main class="section-public">
	<h1>Offres d'emploi</h1>

	<form class="filtres-offres" method="get" th:action="@{/carrieres}" role="search">
		<label class="visuellement-cache" for="q">Rechercher</label>
		<input id="q" name="q" type="search" placeholder="Métier, ville…" th:value="${q}">
		<label class="visuellement-cache" for="typeContrat">Type de contrat</label>
		<select id="typeContrat" name="typeContrat">
			<option value="">Tous les contrats</option>
			<option th:each="t : ${typesContrat}" th:value="${t.idTypeContrat}" th:text="${t.libelle}"
					th:selected="${t.idTypeContrat == typeContrat}">CDI</option>
		</select>
		<button type="submit" class="bouton-public">Rechercher</button>
		<a th:if="${q != null or typeContrat != null}" th:href="@{/carrieres}" href="#" class="lien-effacer">Effacer</a>
	</form>

	<p class="resultats" th:if="${offres != null}"
	   th:text="${offres.size() == 0 ? 'Aucune offre ne correspond à votre recherche.' : (offres.size() == 1 ? '1 offre' : offres.size() + ' offres')}">2 offres</p>

	<div class="grille-offres" th:remove="all-but-first">
		<th:block th:each="offre : ${offres}"><article th:replace="~{public/layout-public :: carte-offre(${offre})}"></article></th:block>
		<article class="carte-offre">
			<span class="badge-contrat">CDD</span>
			<h3><a href="offre-detail.html">Assistant(e) comptable</a></h3>
			<p class="offre-infos">Antananarivo · jusqu'au 09/11/2026</p>
			<p class="offre-resume">Vous assistez le responsable financier : saisie des pièces, rapprochements bancaires…</p>
			<a class="lien-offre" href="offre-detail.html">Voir l'offre &rarr;</a>
		</article>
	</div>
</main>

<footer th:replace="~{public/layout-public :: pied}"></footer>
</body>
</html>
