<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{public/layout-public :: head(${title})}">
	<meta charset="UTF-8">
	<title>Candidature envoyée | Mr Tovo</title>
	<link rel="stylesheet" href="../../static/css/style.css">
	<link rel="stylesheet" href="../../static/css/recrutement.css">
</head>
<body class="page-public">
<header th:replace="~{public/layout-public :: entete}"></header>

<main class="section-public confirmation">
	<div class="icone-succes" aria-hidden="true">&#10003;</div>
	<h1>Merci, votre candidature est envoyée !</h1>
	<p th:if="${offre != null}">
		Votre candidature au poste <strong th:text="${offre.titre}">Développeur Java / Spring Boot</strong> a bien été reçue.
	</p>
	<p>Notre équipe RH l'étudie et vous tiendra informé(e). Vous pouvez suivre son avancement depuis votre espace candidat.</p>
	<p class="actions-confirmation">
		<a class="bouton-public" th:href="@{/espace-candidat}" href="../espace-candidat/candidatures.html">Suivre mes candidatures</a>
		<a class="bouton-public bouton-contour" th:href="@{/carrieres}" href="offres.html">Voir les autres offres</a>
	</p>
</main>

<footer th:replace="~{public/layout-public :: pied}"></footer>
</body>
</html>
