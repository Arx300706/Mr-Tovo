<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Propositions d’emploi')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: menu}"></aside>
    <main class="contenu">
        <div th:replace="~{fragments/layout :: messages}"></div>
        <div class="entete-page"><div><h1>Propositions d'emploi</h1></div></div>

        <div class="carte">
            <h2>Candidats retenus sans proposition
                <span th:replace="~{fragments/layout :: pastille(${#lists.size(candidaturesSucces)})}"></span></h2>
            <p class="doux" th:if="${#lists.isEmpty(candidaturesSucces)}">Aucun candidat en attente de proposition.</p>
            <div class="tableau-conteneur" th:unless="${#lists.isEmpty(candidaturesSucces)}">
                <table>
                    <thead><tr><th>Candidat</th><th>Offre</th><th>Type</th><th></th></tr></thead>
                    <tbody>
                    <tr th:each="c : ${candidaturesSucces}">
                        <td><a th:href="@{/rh/candidatures/{id}(id=${c.id})}" th:text="${c.compte.nomComplet}"></a></td>
                        <td th:text="${c.offre.intitule}"></td>
                        <td th:text="${c.typeCandidature.libelle}"></td>
                        <td><a class="bouton petit" th:href="@{/rh/propositions/nouvelle(candidature=${c.id})}">Créer la proposition</a></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="filtres">
            <a th:href="@{/rh/propositions}" th:classappend="${statut == null or statut == ''} ? 'actif'">toutes</a>
            <a th:each="s : ${statuts}" th:href="@{/rh/propositions(statut=${s.libelle})}" th:text="${s.libelle}"
               th:classappend="${statut == s.libelle} ? 'actif'"></a>
        </div>
        <div class="carte tableau-conteneur">
            <table>
                <thead><tr><th>N°</th><th>Candidat</th><th>Poste</th><th class="nombre">Salaire</th><th>Contrat</th><th>Limite</th><th>Statut</th><th></th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(propositions)}"><td colspan="8" class="vide">Aucune proposition.</td></tr>
                <tr th:each="p : ${propositions}" th:classappend="${p.statut.libelle == 'en attente'} ? 'mise-en-avant'">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.candidature.compte.nomComplet}"></td>
                    <td th:text="${p.poste.libelle}"></td>
                    <td class="nombre"><span th:replace="~{fragments/layout :: montant(${p.salaire})}"></span></td>
                    <td th:text="${p.typeContrat.libelle}"></td>
                    <td th:text="${#temporals.format(p.dateLimiteValidation, 'dd/MM/yyyy')}"></td>
                    <td><span th:replace="~{fragments/layout :: statut(${p.statut.libelle})}"></span></td>
                    <td><a class="bouton petit secondaire" th:href="@{/rh/propositions/{id}(id=${p.id})}">Ouvrir</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
