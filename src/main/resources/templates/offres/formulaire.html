<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}">
	<meta charset="UTF-8">
	<title>Modifier l'offre | Mr Tovo</title>
	<link rel="stylesheet" href="../../static/css/style.css">
</head>
<body>
<header th:replace="~{fragments/entete :: entete}"></header>
<link rel="stylesheet" href="../../static/css/recrutement.css" th:href="@{/css/recrutement.css}">

<div class="page-connectee">
	<aside th:replace="~{fragments/menu :: menu(actif='offres')}"></aside>

	<main class="contenu">
		<a class="lien-retour" th:href="${offre == null} ? @{/offres} : @{/offres/{id}(id=${offre.idOffre})}" href="detail.html">&larr; Retour</a>
		<h1 th:text="${offre == null ? 'Nouvelle offre' : 'Modifier l''offre'}">Modifier l'offre</h1>
		<p>L'offre reste en <strong>brouillon</strong> tant qu'elle n'est pas publiée depuis sa fiche.</p>

		<form class="formulaire formulaire-large carte" method="post"
			  th:action="${offre == null} ? @{/offres/nouveau} : @{/offres/{id}/modifier(id=${offre.idOffre})}"
			  th:object="${formulaire}">
			<label for="titre">Titre du poste *</label>
			<input id="titre" type="text" th:field="*{titre}" required maxlength="150" value="Développeur Java / Spring Boot">
			<span class="erreur-champ" th:if="${#fields.hasErrors('titre')}" th:errors="*{titre}">Le titre est obligatoire</span>

			<div class="ligne-champs">
				<div class="champ">
					<label for="idTypeContrat">Type de contrat</label>
					<select id="idTypeContrat" th:field="*{idTypeContrat}">
						<option value="">— choisir —</option>
						<option th:each="t : ${typesContrat}" th:value="${t.idTypeContrat}" th:text="${t.libelle}">CDI</option>
					</select>
				</div>
				<div class="champ">
					<label for="lieu">Lieu</label>
					<input id="lieu" type="text" th:field="*{lieu}" maxlength="150" value="Antananarivo">
					<span class="erreur-champ" th:if="${#fields.hasErrors('lieu')}" th:errors="*{lieu}">Erreur</span>
				</div>
				<div class="champ">
					<label for="dateLimite">Date limite</label>
					<input id="dateLimite" type="date" th:field="*{dateLimite}">
				</div>
			</div>

			<label for="description">Description du poste <small>(obligatoire pour publier)</small></label>
			<textarea id="description" th:field="*{description}" rows="7">Au sein de l'équipe informatique, vous développez et maintenez nos applications internes.</textarea>
			<span class="erreur-champ" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Erreur</span>

			<label for="profil">Profil recherché</label>
			<textarea id="profil" th:field="*{profil}" rows="5">Bac+3 minimum en informatique, 2 ans d'expérience en Java.</textarea>
			<span class="erreur-champ" th:if="${#fields.hasErrors('profil')}" th:errors="*{profil}">Erreur</span>

			<div class="actions">
				<button type="submit">Enregistrer le brouillon</button>
			</div>
		</form>
	</main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
