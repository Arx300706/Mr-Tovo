<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}">
	<meta charset="UTF-8">
	<title>Offres | Mr Tovo</title>
	<link rel="stylesheet" href="../../static/css/style.css">
</head>
<body>
<header th:replace="~{fragments/entete :: entete}"></header>
<link rel="stylesheet" href="../../static/css/recrutement.css" th:href="@{/css/recrutement.css}">

<div class="page-connectee">
	<aside th:replace="~{fragments/menu :: menu(actif='offres')}"></aside>

	<main class="contenu">
		<div class="titre-page">
			<h1>Offres d'emploi</h1>
			<a class="bouton" th:href="@{/offres/nouveau}" href="formulaire.html">+ Nouvelle offre</a>
		</div>

		<p class="alerte alerte-succes" th:if="${succes}" th:text="${succes}">Offre publiée.</p>
		<p class="alerte alerte-erreur" th:if="${erreur}" th:text="${erreur}">Erreur</p>

		<nav class="filtres-statut" aria-label="Filtrer par statut">
			<a th:href="@{/offres}" th:classappend="${statut == null or statut == ''} ? 'actif'" href="#">Toutes</a>
			<a th:each="s : ${statuts}" th:href="@{/offres(statut=${s.libelle})}" th:text="${s.libelle}"
			   th:classappend="${s.libelle == statut} ? 'actif'" href="#">publiée</a>
		</nav>

		<p class="vide" th:if="${offres != null and offres.isEmpty()}">Aucune offre pour ce filtre.</p>

		<div class="tableau-defilant" th:unless="${offres != null and offres.isEmpty()}">
			<table class="tableau">
				<thead>
					<tr>
						<th>Titre</th>
						<th>Contrat</th>
						<th>Lieu</th>
						<th>Statut</th>
						<th>Date limite</th>
						<th class="nombre">Candidatures</th>
					</tr>
				</thead>
				<tbody th:remove="all-but-first">
					<tr th:each="offre : ${offres}">
						<td><a th:href="@{/offres/{id}(id=${offre.idOffre})}" th:text="${offre.titre}" href="detail.html">Développeur Java / Spring Boot</a></td>
						<td th:text="${offre.typeContrat?.libelle} ?: '—'">CDI</td>
						<td th:text="${offre.lieu} ?: '—'">Antananarivo</td>
						<td><span class="badge-statut" th:classappend="'statut-' + ${offre.statutOffre.code}" th:text="${offre.statutOffre.libelle}">publiée</span></td>
						<td th:text="${offre.dateLimite != null ? #temporals.format(offre.dateLimite, 'dd/MM/yyyy') : '—'}">19/11/2026</td>
						<td class="nombre">
							<a th:href="@{/offres/{id}/candidatures(id=${offre.idOffre})}"
							   th:text="${nombresCandidatures.getOrDefault(offre.idOffre, 0L)}" href="../candidatures/liste.html">5</a>
						</td>
					</tr>
					<tr>
						<td><a href="detail.html">Chargé(e) de recrutement</a></td><td>CE</td><td>Antananarivo</td>
						<td><span class="badge-statut statut-brouillon">brouillon</span></td><td>04/12/2026</td><td class="nombre">0</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
