<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/entete :: entete}"></header>

<!-- Connexion à deux entrées (FR0-04). Garder les noms des champs : identifiant, motDePasse, espace. -->
<main class="container">
	<h1>Connexion</h1>

	<p class="alerte alerte-succes" th:if="${succes}" th:text="${succes}">Compte créé.</p>
	<p class="alerte alerte-succes" th:if="${param.deconnecte}">Vous êtes déconnecté.</p>
	<p class="alerte alerte-erreur" th:if="${param.erreur}">Identifiant ou mot de passe incorrect.</p>

	<nav class="onglets">
		<a th:href="@{/connexion(espace='employe')}" th:classappend="${espace == 'employe'} ? 'actif'">Espace employé</a>
		<a th:href="@{/connexion(espace='candidat')}" th:classappend="${espace == 'candidat'} ? 'actif'">Espace candidat</a>
	</nav>

	<form th:if="${espace == 'employe'}" class="formulaire" method="post" th:action="@{/connexion}">
		<input type="hidden" name="espace" value="employe">
		<label for="matricule">Matricule</label>
		<input id="matricule" name="identifiant" type="text" required autofocus autocomplete="username" placeholder="EMP001">
		<label for="mdp-employe">Mot de passe</label>
		<input id="mdp-employe" name="motDePasse" type="password" required autocomplete="current-password">
		<button type="submit">Se connecter</button>
	</form>

	<form th:if="${espace == 'candidat'}" class="formulaire" method="post" th:action="@{/connexion}">
		<input type="hidden" name="espace" value="candidat">
		<label for="identifiant">Identifiant (e-mail)</label>
		<input id="identifiant" name="identifiant" type="email" required autofocus autocomplete="username" placeholder="vous@exemple.mg">
		<label for="mdp-candidat">Mot de passe</label>
		<input id="mdp-candidat" name="motDePasse" type="password" required autocomplete="current-password">
		<button type="submit">Se connecter</button>
		<p>Pas encore de compte ? <a th:href="@{/inscription}">Créer un compte candidat</a></p>
	</form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
