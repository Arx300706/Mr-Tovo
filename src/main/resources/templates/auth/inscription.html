<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/entete :: entete}"></header>

<!-- Création de compte candidat (FR0-04). Garder les noms des champs (InscriptionFormulaire). -->
<main class="container">
	<h1>Créer un compte candidat</h1>

	<form class="formulaire" method="post" th:action="@{/inscription}" th:object="${formulaire}">
		<input type="hidden" name="offre" th:if="${offre != null}" th:value="${offre}">
		<p class="alerte alerte-info" th:if="${offre != null}">Créez votre compte : vous reviendrez ensuite sur le formulaire de candidature.</p>
		<p class="alerte alerte-erreur" th:if="${#fields.hasErrors('motsDePasseIdentiques')}" th:errors="*{motsDePasseIdentiques}">Erreur</p>

		<label for="nom">Nom</label>
		<input id="nom" type="text" th:field="*{nom}" required>
		<span class="erreur-champ" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}">Erreur</span>

		<label for="prenom">Prénom</label>
		<input id="prenom" type="text" th:field="*{prenom}" required>
		<span class="erreur-champ" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}">Erreur</span>

		<label for="email">E-mail (servira d'identifiant)</label>
		<input id="email" type="email" th:field="*{email}" required autocomplete="username">
		<span class="erreur-champ" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Erreur</span>

		<label for="telephone">Téléphone (facultatif)</label>
		<input id="telephone" type="tel" th:field="*{telephone}">
		<span class="erreur-champ" th:if="${#fields.hasErrors('telephone')}" th:errors="*{telephone}">Erreur</span>

		<label for="motDePasse">Mot de passe (8 caractères minimum)</label>
		<input id="motDePasse" type="password" th:field="*{motDePasse}" required autocomplete="new-password">
		<span class="erreur-champ" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}">Erreur</span>

		<label for="confirmationMotDePasse">Confirmer le mot de passe</label>
		<input id="confirmationMotDePasse" type="password" th:field="*{confirmationMotDePasse}" required autocomplete="new-password">
		<span class="erreur-champ" th:if="${#fields.hasErrors('confirmationMotDePasse')}" th:errors="*{confirmationMotDePasse}">Erreur</span>

		<button type="submit">Créer mon compte</button>
		<p>Déjà inscrit ? <a th:href="@{/connexion(espace='candidat')}">Se connecter</a></p>
	</form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
