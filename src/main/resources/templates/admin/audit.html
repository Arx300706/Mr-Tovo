<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${title})}"></head>
<body>
<header th:replace="~{fragments/entete :: entete}"></header>

<div class="page-connectee">
	<aside th:replace="~{fragments/menu :: menu(actif='admin-audit')}"></aside>

	<main class="contenu">
		<h1>Journal d'audit</h1>
		<p>Les 200 dernières actions, de la plus récente à la plus ancienne.</p>

		<p class="vide" th:if="${journaux != null and journaux.isEmpty()}">Aucune action enregistrée pour le moment.</p>

		<div class="tableau-defilant" th:unless="${journaux != null and journaux.isEmpty()}">
			<table class="tableau">
				<thead>
					<tr>
						<th>Date</th>
						<th>Auteur</th>
						<th>Action</th>
						<th>Objet</th>
						<th>Détail</th>
					</tr>
				</thead>
				<tbody th:remove="all-but-first">
					<tr th:each="journal : ${journaux}">
						<td th:text="${#temporals.format(journal.dateAction, 'dd/MM/yyyy HH:mm')}">20/10/2026 09:15</td>
						<td th:text="${journal.auteur}">admin</td>
						<td><span class="badge badge-neutre" th:text="${journal.action}">DESACTIVER</span></td>
						<td th:text="${journal.objet + (journal.idObjet != null ? ' #' + journal.idObjet : '')}">Compte #7</td>
						<td th:text="${journal.detail}">EMP001</td>
					</tr>
					<tr>
						<td>20/10/2026 06:00</td><td>systeme</td><td><span class="badge badge-neutre">CLOTURER_EXPIREES</span></td>
						<td>Offre</td><td>2 ligne(s) modifiée(s) automatiquement</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
