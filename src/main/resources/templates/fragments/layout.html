<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' | Mr Tovo'">Mr Tovo</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="header" class="site-header">
	<a class="brand" th:href="@{/}">Mr Tovo</a>
	<nav>
		<a th:href="@{/}">Accueil</a>
	</nav>
</header>

<footer th:fragment="footer" class="site-footer">
	<p>&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> Groupe</p>
	<script th:src="@{/js/app.js}"></script>
</footer>

</body>
</html>
