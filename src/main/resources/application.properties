spring.application.name=mr-tovo
server.port=8080

# PostgreSQL : la base « rh » est créée avec src/main/resources/db/schema.sql puis data.sql (voir README)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Le schéma est géré par les scripts SQL : Hibernate vérifie seulement qu'il correspond aux entités
spring.jpa.hibernate.ddl-auto=validate
# Les vues Thymeleaf parcourent les associations (chargement paresseux) : session ouverte pendant le rendu
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Indian/Antananarivo

# Thymeleaf
spring.thymeleaf.cache=false

# Messages et erreurs de validation en français, quel que soit le navigateur
spring.web.locale=fr
spring.web.locale-resolver=fixed

# Les pièces jointes ne sont pas limitées par Spring ; leurs formats restent validés
# par le service de candidature.
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
# Tomcat applique également ses propres plafonds aux formulaires multipart.
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
server.tomcat.max-part-count=-1

# Pages d'erreur (templates/error/) : pas de trace technique pour l'utilisateur
server.error.include-stacktrace=never
server.error.include-message=never
