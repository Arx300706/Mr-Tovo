spring.application.name=mr-tovo
server.port=8080

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# MySQL (XAMPP : utilisateur root sans mot de passe par défaut).
# Créer la base une première fois : /opt/lampp/bin/mysql -uroot < src/main/resources/db/schema.sql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mr_tovo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Indian/Antananarivo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# XAMPP fournit MariaDB : dialecte forcé (mettre org.hibernate.dialect.MySQLDialect pour un vrai MySQL 8)
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MariaDBDialect}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Pages d'erreur (templates/erreurs/) : jamais de trace technique à l'utilisateur
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Comptes de démo (un par rôle, mot de passe demo1234) : mettre à false en production
mrtovo.demo.comptes=${DEMO_COMPTES:true}

# Tâche quotidienne (offres / propositions expirées, fins de contrat) : tous les jours à 6h
mrtovo.taches.actives=true
mrtovo.taches.cron=0 0 6 * * *
