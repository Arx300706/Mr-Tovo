spring.application.name=mr-tovo
server.port=8080

# PostgreSQL : base « rh » (à créer une fois, voir README) ; les tables sont créées par Flyway
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Le schéma est géré par Flyway (db/migration) : Hibernate vérifie seulement qu'il correspond aux entités
spring.jpa.hibernate.ddl-auto=validate
# Base existante créée avant Flyway (ancien schema.sql + data.sql) : considérée comme étant en V2
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
# Les vues Thymeleaf parcourent les associations (chargement paresseux) : session ouverte pendant le rendu
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Indian/Antananarivo

# Thymeleaf
spring.thymeleaf.cache=false

# Messages et erreurs de validation en français, quel que soit le navigateur
spring.web.locale=fr
spring.web.locale-resolver=fixed

# CV en PDF : 5 Mo maximum
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Pages d'erreur (templates/error/) : pas de trace technique pour l'utilisateur
server.error.include-stacktrace=never
server.error.include-message=never
